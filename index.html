<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin - 거래소 시세 비교</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo-block">
      <h1 class="logo">Coin</h1>
      <span class="header-today-date" id="headerTodayDate"></span>
    </div>
    <div class="header-rate-wrap">
      <div class="header-rate-block">
        <span class="header-rate" id="headerRate">환율 : 1,445원(<span class="header-rate-percent">-</span>)</span>
        <span class="header-date" id="headerDate"></span>
      </div>
      <button type="button" class="header-rate-edit" id="headerRateEdit" title="환율 수정">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="modal-overlay" id="rateModal">
    <div class="modal-content">
      <h3 class="modal-title">환율 설정</h3>
      <p class="modal-desc">우측 상단에 표시할 환율 금액을 입력하세요.</p>
      <div class="modal-form">
        <label for="rateInput">환율 (원)</label>
        <input type="number" id="rateInput" class="modal-input" min="1" max="999999" step="0.01" placeholder="1445.00">
        <label for="dateInput">날짜</label>
        <input type="date" id="dateInput" class="modal-input">
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn-cancel" id="rateModalCancel">취소</button>
          <button type="button" class="modal-btn modal-btn-save" id="rateModalSave">저장</button>
        </div>
      </div>
    </div>
  </div>

  <main class="main">
    <section class="exchange-selector">
      <div class="selector-group">
        <label for="baseExchange">기준 거래소</label>
        <select id="baseExchange" class="select">
          <option value="">거래소 선택</option>
          <option value="upbit" selected>Upbit</option>
        </select>
      </div>
      <div class="selector-group">
        <label for="overseasExchange">해외 거래소</label>
        <select id="overseasExchange" class="select">
          <option value="">거래소 선택</option>
          <option value="gate_usdt" selected>Gate</option>
        </select>
      </div>
    </section>

    <section class="coin-list-section">
      <div class="coin-list-container">
        <table class="coin-table" id="coinTable">
          <thead>
            <tr>
              <th>김프</th>
              <th>기준 거래소 가격</th>
              <th>해외 거래소 가격</th>
              <th>거래(억)</th>
            </tr>
          </thead>
          <tbody id="coinTableBody">
            <tr class="empty-state">
              <td colspan="4">기준 거래소와 해외 거래소를 선택해주세요.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
