<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인프리미엄 · 거래소 시세 비교</title>
  <link rel="stylesheet" href="style.css?v=term-layer-lock-1">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kimp-coin-theme');
        var ok = t === 'dark' || t === 'light' || t === 'black' || t === 'terminal' || t === 'terminal-color';
        if (ok) document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', 'terminal');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">CP</span>
          <span class="brand-date" id="headerTodayDate"></span>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="테마 전환">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
        </svg>
        <svg class="theme-icon theme-icon-black" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <path d="M12 5.5h5.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H12V5.5z" fill="currentColor"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-icon theme-icon-terminal" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
          <path d="M7 9l3 3-3 3M12 15h5"/>
        </svg>
        <svg class="theme-icon theme-icon-terminal-color" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
          <path d="M7 9l3 3-3 3M12 15h5"/>
          <circle cx="18.5" cy="7" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <section class="controls">
        <div class="control-group control-base">
          <span class="control-label">기준 거래소</span>
          <div class="fixed-exchange">Upbit</div>
        </div>
        <div class="control-group control-compare">
          <span class="control-label">비교 거래소</span>
          <div class="segmented" id="comparisonSegmented" role="tablist">
            <button class="segmented-btn is-active" data-value="gate" type="button" role="tab" aria-selected="true">Gate</button>
            <button class="segmented-btn" data-value="binance" type="button" role="tab" aria-selected="false">Binance</button>
            <button class="segmented-btn" data-value="bithumb" type="button" role="tab" aria-selected="false">Bithumb</button>
          </div>
        </div>
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text">실시간 갱신</span>
        </div>
      </section>

      <section class="coin-grid" id="coinGrid">
        <div class="empty-state" id="emptyState">데이터 로딩 중...</div>
      </section>

      <section class="terminal-shell" id="terminalShell" hidden>
        <pre class="terminal-ls" id="terminalLs" aria-live="polite" aria-label="파일 목록"></pre>
        <div class="terminal-prompt" id="terminalPrompt" aria-hidden="true">
          <div class="terminal-cmdline" id="terminalCmdline">user@local:~$ sudo vim /etc/apt/sources.list.d/ubuntu.sources /var/log/syslog /usr/local/etc/kimp/gate.cfg +":set nowrap nonumber" +"/premium"</div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js?v=term-layer-lock-1"></script>
</body>
</html>
