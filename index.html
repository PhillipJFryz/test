<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin - 거래소 시세 비교</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo-block">
      <h1 class="logo">Coin</h1>
      <span class="header-today-date" id="headerTodayDate"></span>
    </div>
    <div class="header-rate-wrap">
      <div class="header-rate-block">
        <span class="header-rate" id="headerRate">원/달러 : - 원</span>
        <span class="header-date" id="headerDate"></span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="exchange-selector">
      <div class="selector-group">
        <label for="baseExchange">기준 거래소</label>
        <select id="baseExchange" class="select">
          <option value="">거래소 선택</option>
          <option value="upbit" selected>Upbit</option>
        </select>
      </div>
      <div class="selector-group">
        <label for="overseasExchange">해외 거래소</label>
        <select id="overseasExchange" class="select">
          <option value="">거래소 선택</option>
          <option value="gate_usdt" selected>Gate</option>
        </select>
      </div>
    </section>

    <section class="coin-list-section">
      <div class="coin-list-container">
        <table class="coin-table" id="coinTable">
          <thead>
            <tr>
              <th>김프</th>
              <th>기준 거래소 가격</th>
              <th>해외 거래소 가격</th>
              <th>거래(억)</th>
            </tr>
          </thead>
          <tbody id="coinTableBody">
            <tr class="empty-state">
              <td colspan="4">기준 거래소와 해외 거래소를 선택해주세요.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
