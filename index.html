<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인프리미엄 · 거래소 시세 비교</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">CP</span>
          <span class="brand-date" id="headerTodayDate"></span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="controls">
        <div class="control-group">
          <span class="control-label">기준 거래소</span>
          <div class="fixed-exchange">Upbit</div>
        </div>
        <div class="control-group">
          <span class="control-label">비교 거래소</span>
          <div class="segmented" id="comparisonSegmented" role="tablist">
            <button class="segmented-btn is-active" data-value="gate" type="button" role="tab" aria-selected="true">Gate</button>
            <button class="segmented-btn" data-value="binance" type="button" role="tab" aria-selected="false">Binance</button>
            <button class="segmented-btn" data-value="bithumb" type="button" role="tab" aria-selected="false">Bithumb</button>
          </div>
        </div>
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text">실시간 갱신</span>
        </div>
      </section>

      <section class="coin-grid" id="coinGrid">
        <div class="empty-state" id="emptyState">데이터 로딩 중...</div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
